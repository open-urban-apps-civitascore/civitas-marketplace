replicaCount: 1

# CPU/memory requests and limits; empty means none (fine for local dev).
resources: {}

image:
  repository: civitas-marketplace
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# The platform deployment serves the app through an APISIX route (like the
# portal BFF) and disables this ingress; it stays for standalone installs.
ingress:
  enabled: true
  className: nginx
  host: marketplace.civitas.test
  # NextAuth's chunked session cookies (three Keycloak tokens, encrypted) push
  # the callback response headers past nginx's 4k default buffer; without this
  # the login callback dies with 502 "upstream sent too big header".
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
  # TLS is filled per environment (cluster: the selfsigned-ca issuer).
  tls:
    enabled: false
    secretName: ""
    clusterIssuer: ""

# The public URL the browser reaches this app at (NEXTAUTH_URL, post-logout).
publicUrl: "https://marketplace.civitas.test"

# Where "view in portal" links point (the portal frontend, browser-facing).
portalUrl: "https://portal.civitas.test"

keycloak:
  clientId: marketplace
  realm: core
  # Browser-facing issuer (redirects, id_token validation).
  issuer: "https://idm.civitas.test/realms/core"
  # Container-internal issuer (token/userinfo/jwks) — the dual-issuer trick.
  # Falls back to `issuer` in auth.ts when left empty.
  internalIssuer: ""
  # Signature algorithm of the realm's id_tokens. Keycloak's default is RS256;
  # the CIVITAS cluster realm is hardened to ES256 (TR-03187).
  idTokenAlg: "RS256"
  # Secret holding the client secret, created by the deployment pipeline.
  clientSecret:
    secretName: keycloak-client-marketplace
    key: client-secret

# Where the app reaches the platform API — the APISIX gateway, never the
# portal-backend directly.
api:
  baseUrl: "http://apisix-gateway.apisix.svc.cluster.local"
  port: "80"

# NextAuth session-cookie encryption secret.
nextauthSecret:
  secretName: marketplace-nextauth-secret
  key: secret

# Self-signed cluster CA: Node rejects the certificate chain otherwise.
# (The portal frontend sets the same flag, with a TODO to mount the CA properly.)
nodeTlsRejectUnauthorized: "0"
