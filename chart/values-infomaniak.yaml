# Standalone-install values for the Infomaniak cluster (helm install -f …).
# NOTE: the canonical cluster deployment runs through the deployment repo's
# civitas-marketplace addon, which templates these values from the environment —
# keep this file aligned when the addon changes.
image:
  repository: ghcr.io/open-urban-apps-civitascore/civitas-marketplace
  tag: v0.3.0
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  host: marketplace.dev.openurbanapps.org
  tls:
    enabled: true
    secretName: marketplace-tls
    clusterIssuer: letsencrypt

publicUrl: "https://marketplace.dev.openurbanapps.org"

portalUrl: "https://portal.dev.openurbanapps.org"

keycloak:
  clientId: marketplace
  realm: core
  issuer: "https://idm.dev.openurbanapps.org/realms/core"
  # Browser goes to idm.<domain>; the container reaches Keycloak internally.
  internalIssuer: "http://keycloak-app-keycloakx-http.core.svc.cluster.local/realms/core"
  # The realm signs with ES256 (TR-03187 hardening in the realm template).
  idTokenAlg: "ES256"
  clientSecret:
    secretName: keycloak-client-marketplace
    key: client-secret

api:
  baseUrl: "http://apisix-gateway.core.svc.cluster.local"
  port: "80"

nextauthSecret:
  secretName: marketplace-nextauth-secret
  key: secret

# Let's Encrypt certificates verify normally — no TLS override needed.
nodeTlsRejectUnauthorized: ""
