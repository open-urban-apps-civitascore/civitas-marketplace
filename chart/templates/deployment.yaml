apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: NEXTAUTH_URL
              value: {{ .Values.publicUrl | quote }}
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nextauthSecret.secretName }}
                  key: {{ .Values.nextauthSecret.key }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.clientSecret.secretName }}
                  key: {{ .Values.keycloak.clientSecret.key }}
            - name: KEYCLOAK_ISSUER
              value: {{ .Values.keycloak.issuer | quote }}
            {{- if .Values.keycloak.internalIssuer }}
            - name: KEYCLOAK_INTERNAL_ISSUER
              value: {{ .Values.keycloak.internalIssuer | quote }}
            {{- end }}
            {{- if .Values.keycloak.idTokenAlg }}
            - name: KEYCLOAK_ID_TOKEN_ALG
              value: {{ .Values.keycloak.idTokenAlg | quote }}
            {{- end }}
            - name: API_BASE_URL
              value: {{ .Values.api.baseUrl | quote }}
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            - name: PORTAL_URL
              value: {{ .Values.portalUrl | quote }}
            {{- if .Values.nodeTlsRejectUnauthorized }}
            # Self-signed cluster CA — see values.yaml note.
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: {{ .Values.nodeTlsRejectUnauthorized | quote }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # /login is a stable 200 that needs no session, so it is a clean
          # health signal; / redirects and depends on auth.
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
